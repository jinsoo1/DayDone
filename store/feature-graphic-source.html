<!--
  피처 그래픽 1024×500 소스. ko/ja 공용 — ?lang=ja 로 열면 일본어.
  렌더: store/render-store-graphics.sh (헤드리스 크롬). 두 언어의 레이아웃·색은 같고 문구만 다르다.
-->
<meta charset="utf-8">
<style>
  html, body { margin:0; padding:0; }
  .wrap { width:1024px; height:500px; position:relative; overflow:hidden;
          background:linear-gradient(120deg,#2E7DF7 0%,#4E82F4 55%,#7C74F1 100%);
          font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Hiragino Sans","Hiragino Kaku Gothic ProN","Malgun Gothic","Noto Sans JP","Noto Sans KR",sans-serif; }
  .copy { position:absolute; left:72px; top:132px; color:#fff; }
  .title { font-size:64px; font-weight:700; letter-spacing:-2px; margin:0; }
  .sub { font-size:27px; font-weight:400; margin:20px 0 0; opacity:.92; line-height:1.45; }
  .badge { display:inline-block; margin-top:30px; padding:9px 18px; border-radius:100px;
           background:rgba(255,255,255,.18); font-size:19px; font-weight:500; }
  .art { position:absolute; right:84px; top:50%; transform:translateY(-50%); }
  [lang="ja"] .title { letter-spacing:-1px; font-size:58px; }
</style>
<div class="wrap" id="wrap">
  <div class="copy">
    <p class="title" id="title"></p>
    <p class="sub" id="sub"></p>
    <span class="badge" id="badge"></span>
  </div>

  <!-- 중심 (54,54) / 반지름 32. 두 호가 같은 원이 되도록 좌표를 정확히 쓴다. -->
  <svg class="art" width="300" height="300" viewBox="0 0 108 108">
    <path d="M31.373,76.627 A32,32 0 1 1 76.627,76.627" stroke="#FFFFFF" stroke-opacity="0.3"
          stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M31.373,76.627 A32,32 0 0 1 74.569,29.487" stroke="#FFFFFF"
          stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M41,54 L50.6,63.6 L68,46" stroke="#FFFFFF"
          stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </svg>
</div>
<script>
  const COPY = {
    ko: { title: "오늘 얼마 써도 될까?",
          sub: "저축·고정비·미래 지출을 먼저 빼두고<br/>남은 돈으로 하루 권장 금액을 알려드려요",
          badge: "데이던 · DayDone" },
    ja: { title: "今日、いくらまで使える？",
          sub: "貯金・固定費・大きな出費を先に差し引いて<br/>残ったお金で1日の目安をお伝えします",
          badge: "DayDone" }
  };
  const lang = new URLSearchParams(location.search).get("lang") || "ko";
  const c = COPY[lang] || COPY.ko;
  document.getElementById("wrap").setAttribute("lang", lang);
  document.getElementById("title").innerHTML = c.title;
  document.getElementById("sub").innerHTML = c.sub;
  document.getElementById("badge").textContent = c.badge;
</script>
